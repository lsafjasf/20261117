<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>碳酸饮料灌装线仿真</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; background: #10151c; color: #dfe7ef; padding: 12px; }
  h1 { font-size: 18px; margin-bottom: 8px; color: #7fd4ff; }
  .layout { display: flex; gap: 12px; flex-wrap: wrap; }
  .panel { background: #1a2230; border: 1px solid #2c3a4e; border-radius: 8px; padding: 10px; }
  #canvasPanel { flex: 1 1 640px; min-width: 480px; }
  #side { flex: 0 1 320px; display: flex; flex-direction: column; gap: 10px; }
  canvas { width: 100%; background: #0c1118; border-radius: 6px; display: block; }
  .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: 13px; }
  .row label { flex: 0 0 88px; color: #9fb2c8; }
  .row output { flex: 0 0 70px; text-align: right; color: #7fd4ff; font-variant-numeric: tabular-nums; }
  input[type=range] { flex: 1; accent-color: #2f9be8; }
  select, button { background: #243247; color: #dfe7ef; border: 1px solid #3a4c66; border-radius: 5px; padding: 5px 10px; font-size: 13px; cursor: pointer; }
  button:hover { background: #2e405c; }
  button.active { background: #2f9be8; color: #fff; }
  button.warn { background: #8a3030; }
  .btnGroup { display: flex; gap: 6px; flex-wrap: wrap; }
  #status { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; font-size: 13px; }
  #status b { color: #7fd4ff; font-weight: 600; }
  #log { height: 180px; overflow-y: auto; font-size: 12px; font-family: Consolas, monospace; background: #0c1118; border-radius: 6px; padding: 6px; }
  #log div { padding: 1px 0; border-bottom: 1px solid #1a2230; }
  .t-device_stop, .t-line_halt, .t-bottle_defect, .t-splash { color: #ff8080; }
  .t-device_start, .t-line_resume, .t-bottle_ok { color: #7fe0a0; }
  .t-param_change { color: #ffd27f; }
  .t-batch_result, .t-reset { color: #7fd4ff; }
  .devBtns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
</style>
</head>
<body>
<h1>碳酸饮料灌装线仿真 <span id="clock" style="color:#9fb2c8;font-size:13px"></span></h1>
<div class="layout">
  <div class="panel" id="canvasPanel"><canvas id="cv" width="900" height="420"></canvas></div>
  <div id="side">
    <div class="panel">
      <div class="row"><label>饮料种类</label>
        <select id="beverage">
          <option value="soda">苏打水 (4.0vol)</option>
          <option value="cola">可乐汽水 (3.2vol)</option>
          <option value="tea">微气泡茶 (2.2vol)</option>
        </select>
      </div>
      <div class="row"><label>CO2压力</label><input type="range" id="pressure" min="0.5" max="5" step="0.1" value="3"><output id="pressure_v"></output></div>
      <div class="row"><label>液温设定</label><input type="range" id="tempSet" min="0" max="20" step="0.5" value="4"><output id="tempSet_v"></output></div>
      <div class="row"><label>灌装速度</label><input type="range" id="fillSpeed" min="6" max="30" step="1" value="12"><output id="fillSpeed_v"></output></div>
      <div class="row"><label>封盖时机</label><input type="range" id="capDelay" min="0.5" max="8" step="0.1" value="3"><output id="capDelay_v"></output></div>
    </div>
    <div class="panel">
      <div class="devBtns" id="devices"></div>
    </div>
    <div class="panel">
      <div class="btnGroup">
        <button id="pauseBtn">暂停</button>
        <button id="stepBtn">单步</button>
        <button id="resetBtn" class="warn">批次重置</button>
        <button id="exportBtn">导出报告</button>
        <button id="muteBtn">声音:开</button>
      </div>
    </div>
    <div class="panel"><div id="status"></div></div>
    <div class="panel"><div id="log"></div></div>
  </div>
</div>
<script src="sim.js"></script>
<script src="app.js"></script>
</body>
</html>
