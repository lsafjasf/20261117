<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>海报网格编辑器</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="toolbar">
  <span class="brand">海报网格编辑器</span>
  <label>栏数
    <select id="columns">
      <option value="3">三栏</option>
      <option value="4">四栏</option>
    </select>
  </label>
  <label>缩放
    <select id="zoom">
      <option value="0.4">40%</option>
      <option value="0.6" selected>60%</option>
      <option value="0.8">80%</option>
      <option value="1">100%</option>
    </select>
  </label>
  <button id="btn-reflow" title="保留已固定区块，重排其余区块">重排未固定</button>
  <span class="sep"></span>
  <button id="btn-undo" disabled>撤销</button>
  <button id="btn-redo" disabled>重做</button>
  <span class="sep"></span>
  <button id="btn-save">保存</button>
  <button id="btn-reload">重新载入</button>
  <button id="btn-import">导入 JSON</button>
  <input type="file" id="file-import" accept="application/json,.json" hidden>
  <span class="sep"></span>
  <button id="btn-export-png">导出 PNG</button>
  <button id="btn-export-svg">导出 SVG</button>
  <button id="btn-export-json">导出网格 JSON</button>
  <span class="sep"></span>
  <button id="btn-demo-standard">标准案例</button>
  <button id="btn-demo-extreme">极端案例</button>
</header>

<main id="main">
  <section id="canvas-wrap">
    <canvas id="poster"></canvas>
  </section>

  <aside id="sidebar">
    <div id="toast" class="hidden"></div>

    <section id="inspector">
      <h2>区块属性</h2>
      <p id="no-selection">点击画布中的区块进行编辑；拖动可移动（自动吸附网格）。</p>
      <div id="editor" class="hidden">
        <label>标题 <input id="ed-title" type="text"></label>
        <label>说明 <textarea id="ed-text" rows="5"></textarea></label>
        <label>标题字号 <input id="ed-title-size" type="number" min="10" max="120"></label>
        <label>正文字号 <input id="ed-font-size" type="number" min="8" max="72"></label>
        <label>图片颜色 <input id="ed-color" type="color"></label>
        <label>占列数 <input id="ed-col-span" type="number" min="1" max="4"></label>
        <label>行高（格） <input id="ed-row-span" type="number" min="1" max="20"></label>
        <label class="row"><input id="ed-auto-height" type="checkbox"> 自动高度（避免裁切）</label>
        <label class="row"><input id="ed-pinned" type="checkbox"> 固定此区块（重排时不动）</label>
        <button id="btn-delete">删除区块</button>
      </div>
      <button id="btn-add">新增区块</button>
    </section>

    <section id="issues">
      <h2>排版检查 <button id="btn-check">重新检查</button></h2>
      <ul id="issue-list"></ul>
    </section>
  </aside>
</main>

<script src="js/model.js"></script>
<script src="js/validate.js"></script>
<script src="js/history.js"></script>
<script src="js/render.js"></script>
<script src="js/app.js"></script>
</body>
</html>
