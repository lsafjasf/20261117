<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>三机位共享时间基准时间线</title>
  <link rel="stylesheet" href="./src/web/styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>多机位时间线 · 共享时间基准演示</h1>
    <div class="status" id="status">已载入示例工程</div>
  </header>

  <section class="previews">
    <div class="preview-card" data-camera="camA">
      <h2>机位 A · 全景</h2>
      <canvas id="camA" width="320" height="180"></canvas>
    </div>
    <div class="preview-card" data-camera="camB">
      <h2>机位 B · 中景</h2>
      <canvas id="camB" width="320" height="180"></canvas>
    </div>
    <div class="preview-card" data-camera="camC">
      <h2>机位 C · 特写</h2>
      <canvas id="camC" width="320" height="180"></canvas>
    </div>
    <div class="preview-card program">
      <h2>节目输出 <span id="programLabel"></span></h2>
      <canvas id="program" width="320" height="180"></canvas>
      <div class="timecode" id="timecode">00:00.000 / 00:00.000</div>
    </div>
  </section>

  <section class="controls">
    <button id="playBtn">播放</button>
    <button id="pauseBtn">暂停</button>
    <button id="loopBtn">循环：开</button>
    <span class="group">
      <button id="splitBtn" title="在播放头处分割选中片段">分割</button>
      <button id="cutBtn">硬切</button>
      <button id="dissolveBtn">短叠化 0.4s</button>
      <button id="dipBtn">黑场过渡 0.3s</button>
    </span>
    <span class="group">
      <button id="overlapBtn" title="制造一次非法重叠用于验证拦截">模拟非法重叠</button>
      <button id="verifyBtn">导出前校验</button>
      <button id="exportBtn">导出视频+镜头表</button>
    </span>
    <span class="group">
      <button id="saveBtn">保存工程</button>
      <button id="loadBtn">重载工程</button>
      <button id="downloadBtn">下载工程文件</button>
      <button id="importBtn">导入工程</button>
      <input type="file" id="fileInput" accept="application/json" hidden />
    </span>
  </section>

  <section class="timeline-wrap">
    <canvas id="timeline" width="1280" height="260"></canvas>
    <div class="hint">
      点击片段选择；拖动片段=波纹移动（自动补位）；点击轨道上方空白处=拖动播放头；
      切点吸附 0.5s 节拍网格。冲突位置以红色三角标出。
    </div>
  </section>

  <section class="panels">
    <div class="panel">
      <h3>校验 / 冲突</h3>
      <ul id="conflictList" class="conflict-list"></ul>
    </div>
    <div class="panel">
      <h3>镜头表</h3>
      <div id="shotList" class="shot-list"></div>
    </div>
    <div class="panel">
      <h3>操作日志（支持失败回放）</h3>
      <div id="journal" class="journal"></div>
      <button id="replayBtn">回放全部操作</button>
    </div>
  </section>

  <script type="module" src="./src/web/app.mjs"></script>
</body>
</html>
