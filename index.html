<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>界面提示音设计台 · Web Audio</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <h1>界面提示音设计台</h1>
  <div id="statusBar">
    <span id="stTransport">状态: 停止</span>
    <span id="stMonitor">监听: 主输出</span>
    <span id="stLevelL">L: -∞ dB</span>
    <span id="stLevelR">R: -∞ dB</span>
    <span id="stNodes">活动节点: 0</span>
  </div>
</header>

<main>
  <section class="panel" id="transportPanel">
    <h2>走带控制</h2>
    <div class="btnRow">
      <button id="btnPlay">▶ 播放</button>
      <button id="btnPause">⏸ 暂停</button>
      <button id="btnReplay">⏮ 重播</button>
      <button id="btnStep">⏭ 单步</button>
      <button id="btnShutdown">⏻ 关闭系统</button>
    </div>
    <div class="btnRow" id="monitorRow">
      <label>试听状态:</label>
      <label><input type="radio" name="monitor" value="master" checked> 主输出</label>
      <label><input type="radio" name="monitor" value="bypass"> 旁路</label>
      <label><input type="radio" name="monitor" value="mute"> 静音</label>
    </div>
    <div class="btnRow">
      <label>主音量 <input type="range" id="masterVolume" min="0" max="1" step="0.01" value="0.8"><span id="masterVolumeVal">0.80</span></label>
      <label>步进间隔 <input type="range" id="stepInterval" min="80" max="800" step="10" value="280"><span id="stepIntervalVal">280 ms</span></label>
    </div>
  </section>

  <section class="panel" id="eventPanel">
    <h2>事件参数（声像: 成功=左 / 警告=中 / 错误=右）</h2>
    <div id="eventControls"></div>
    <p class="hint">点击时间线格子可切换事件类型：无 → 成功 → 警告 → 错误</p>
  </section>

  <section class="panel">
    <h2>事件时间线</h2>
    <canvas id="timelineCanvas" width="760" height="120"></canvas>
  </section>

  <section class="panel">
    <h2>声道分布 / 立体声场</h2>
    <canvas id="stereoCanvas" width="760" height="200"></canvas>
  </section>

  <section class="panel" id="paramPanel">
    <h2>参数保存 / 载入</h2>
    <div class="btnRow">
      <button id="btnSave">💾 保存参数</button>
      <button id="btnLoad">📂 重载参数</button>
      <button id="btnDownload">⬇ 导出参数 JSON</button>
      <button id="btnImport">⬆ 导入参数 JSON</button>
      <input type="file" id="fileParams" accept="application/json" hidden>
      <button id="btnSaveReloadVerify">🔁 保存→重载→复验</button>
    </div>
    <pre id="paramLog" class="log"></pre>
  </section>

  <section class="panel" id="verifyPanel">
    <h2>维度验证（离线渲染）</h2>
    <div class="btnRow">
      <button id="btnBaseline">① 采集基线</button>
      <button id="btnCompare">② 对比验证</button>
      <button id="btnExportWav">⬇ 导出 WAV 并校验</button>
    </div>
    <table id="verifyTable">
      <thead><tr><th>维度</th><th>基线</th><th>当前</th><th>变化</th></tr></thead>
      <tbody></tbody>
    </table>
    <pre id="verifyLog" class="log"></pre>
  </section>
</main>

<script type="module" src="js/main.js"></script>
</body>
</html>
