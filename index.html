<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三风机偏航 / 桨距 / 电缆扭转仿真</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>风电场偏航与桨距控制仿真（3 台风机 · 8 小时）</h1>
  <div id="status-bar">
    <span id="sim-clock">t = 00:00:00</span>
    <span id="sim-state" class="badge">就绪</span>
    <span id="wind-info"></span>
  </div>
</header>

<main>
  <section id="left-panel">
    <canvas id="farm-canvas" width="640" height="520"></canvas>
    <div id="controls">
      <button id="btn-start">开始</button>
      <button id="btn-pause" disabled>暂停</button>
      <button id="btn-step" disabled>单步</button>
      <button id="btn-resume" disabled>恢复</button>
      <button id="btn-reset">重置</button>
      <button id="btn-replay" disabled>回放</button>
      <label>速度
        <select id="speed-select">
          <option value="1">1×</option>
          <option value="4" selected>4×</option>
          <option value="16">16×</option>
          <option value="64">64×</option>
        </select>
      </label>
      <label>种子 <input id="seed-input" type="number" value="20261117" step="1"></label>
    </div>
    <div id="replay-bar" class="hidden">
      <span>回放</span>
      <input id="replay-slider" type="range" min="0" max="0" value="0">
      <span id="replay-time">00:00:00</span>
      <button id="btn-replay-exit">退出回放</button>
    </div>
  </section>

  <section id="right-panel">
    <div id="turbine-cards"></div>
    <canvas id="trend-canvas" width="640" height="300"></canvas>
    <div id="report-panel">
      <h2>运行报告</h2>
      <div id="report-content">尚未运行。</div>
    </div>
  </section>
</main>

<div id="fault-overlay" class="hidden">
  <div id="fault-box">
    <h2 id="fault-title">故障</h2>
    <div id="fault-detail"></div>
    <button id="btn-fault-replay">查看回放</button>
    <button id="btn-fault-reset">重置</button>
  </div>
</div>

<script src="engine.js"></script>
<script src="ui.js"></script>
</body>
</html>
