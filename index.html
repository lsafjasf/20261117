<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>抽象图分层编辑器</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>抽象图分层编辑器</h1>
    <div id="status" class="status ok">就绪</div>
  </header>
  <main>
    <aside id="controls">
      <section>
        <h2>参数</h2>
        <div id="param-form"></div>
      </section>
      <section>
        <h2>操作</h2>
        <div class="btn-row">
          <button id="btn-default">默认预设</button>
          <button id="btn-extreme">极端预设</button>
        </div>
        <div class="btn-row">
          <button id="btn-pause">暂停</button>
          <button id="btn-shot">截图</button>
        </div>
        <div class="btn-row">
          <button id="btn-export-png">导出 PNG</button>
          <button id="btn-export-json">导出层 JSON</button>
        </div>
        <div class="btn-row">
          <label class="file-label">
            导入层 JSON
            <input type="file" id="import-file" accept=".json,application/json">
          </label>
        </div>
      </section>
      <section>
        <h2>图层（点击选择，可单独编辑/隐藏）</h2>
        <div id="layer-list"></div>
      </section>
      <section>
        <h2>统计</h2>
        <div id="stats"></div>
      </section>
    </aside>
    <div id="stage">
      <canvas id="view" width="960" height="640"></canvas>
      <p class="hint">滚轮缩放 · 拖拽平移 · 视角与参数自动保存，刷新后恢复</p>
    </div>
  </main>
  <script src="js/scene.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
