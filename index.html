<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>滑轮组吊装模拟 · 固定步长确定性物理</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <h1>滑轮组吊装模拟</h1>
    <div id="statusPill" class="pill">待机</div>
    <div id="liftPill" class="pill">第 1 次吊装 / 共 2 次</div>
    <div id="clockPill" class="pill">t = 0.00 s</div>
    <div id="checksumPill" class="pill" title="状态校验和（用于一致性比对）">chk = —</div>
  </header>

  <main class="layout">
    <section class="scene-col">
      <div class="canvas-wrap">
        <canvas id="scene" width="960" height="560"></canvas>
        <div id="faultBanner" class="fault-banner hidden"></div>
      </div>
      <div class="chart-wrap">
        <canvas id="trend" width="960" height="150"></canvas>
      </div>
    </section>

    <aside class="side-col">
      <section class="panel" id="hudPanel">
        <h2>物理量监视</h2>
        <div id="gauges"></div>
      </section>

      <section class="panel">
        <h2>操作控制</h2>
        <div class="ctrl-grid">
          <button class="hold" data-input="left">◀ 横移左</button>
          <button class="hold" data-input="right">横移右 ▶</button>
          <button class="hold" data-input="hoistUp">▲ 收绳起升</button>
          <button class="hold" data-input="hoistDown">▼ 放绳下降</button>
          <button id="brakeBtn" data-toggle="brake">刹车：关</button>
          <button id="attachBtn">挂钩 / 释放</button>
        </div>
        <label class="cw-row">配重
          <select id="cwSelect">
            <option value="400">400 kg（偏轻）</option>
            <option value="800" selected>800 kg（标准）</option>
            <option value="1200">1200 kg（偏重）</option>
          </select>
        </label>
        <label class="cw-row"><input type="checkbox" id="forceToggle" checked> 显示受力矢量与边界</label>
        <div class="run-row">
          <button id="runBtn">运行</button>
          <button id="pauseBtn">暂停</button>
          <button id="stepBtn">单步</button>
          <button id="resetBtn">重置</button>
          <button id="replayBtn" disabled>回放</button>
        </div>
        <p class="hint">键盘：←→ 横移，↑↓ 收放绳，空格刹车，P 暂停，N 单步，R 重置</p>
      </section>

      <section class="panel">
        <h2>事件与报告</h2>
        <div id="eventLog" class="event-log"></div>
        <button id="reportBtn">查看最终报告</button>
      </section>
    </aside>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <h2 id="modalTitle">最终报告</h2>
      <pre id="modalBody"></pre>
      <button id="modalClose">关闭</button>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/physics.js"></script>
<script src="js/render.js"></script>
<script src="js/chart.js"></script>
<script src="js/app.js"></script>
</body>
</html>
