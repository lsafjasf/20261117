<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>等高线线稿工作室</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <aside id="panel">
    <h1>等高线线稿工作室</h1>

    <section class="group">
      <h2>参数</h2>
      <label>随机种子
        <input id="p-seed" type="number" step="1" />
      </label>
      <label>线距(等高距) <span class="hint">0.02–0.5</span>
        <input id="p-interval" type="number" step="0.01" />
      </label>
      <label>平滑度 <span class="hint">0–5</span>
        <input id="p-smoothness" type="number" step="1" />
      </label>
      <label>标签密度 <span class="hint">0–3</span>
        <input id="p-labelDensity" type="number" step="1" />
      </label>
      <div class="row">
        <button id="btn-apply">应用</button>
        <button id="btn-save">保存参数</button>
      </div>
      <div id="error-box" class="hidden" role="alert"></div>
    </section>

    <section class="group">
      <h2>预设画面</h2>
      <div class="row">
        <button id="btn-preset-default">默认画面</button>
        <button id="btn-preset-extreme">极端画面</button>
      </div>
    </section>

    <section class="group">
      <h2>图层</h2>
      <label class="check"><input id="layer-terrain" type="checkbox" /> 地形底色</label>
      <label class="check"><input id="layer-contours" type="checkbox" /> 等高线</label>
      <label class="check"><input id="layer-labels" type="checkbox" /> 标注</label>
    </section>

    <section class="group">
      <h2>视图与输出</h2>
      <div class="row">
        <button id="btn-pause">暂停</button>
        <button id="btn-reset-view">重置视角</button>
      </div>
      <div class="row">
        <button id="btn-shot">截图 PNG</button>
        <button id="btn-svg">导出 SVG</button>
      </div>
      <p class="hint">拖拽平移, 滚轮缩放。视角/图层/参数自动保存, 刷新后恢复。</p>
    </section>

    <section class="group">
      <h2>状态</h2>
      <div id="stats" class="mono"></div>
    </section>
  </aside>

  <main id="stage">
    <canvas id="canvas"></canvas>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
