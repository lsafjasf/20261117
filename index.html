<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>双水箱共享闸门与泵 — 物理模拟</title>
<style>
  :root {
    --bg: #10151c;
    --panel: #1a2230;
    --line: #2c3a4f;
    --text: #d7e2ee;
    --dim: #8496ab;
    --ok: #3fbf7f;
    --warn: #e0a83c;
    --bad: #e05252;
    --accent: #4aa3ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px;
    background: var(--bg); color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    display: flex; flex-wrap: wrap; gap: 16px;
  }
  h1 { font-size: 18px; width: 100%; margin: 0 0 4px; }
  .panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 12px;
  }
  canvas { display: block; background: #0c1118; border-radius: 6px; }
  #controls { width: 300px; display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row label { width: 84px; color: var(--dim); font-size: 13px; }
  .row output { width: 64px; text-align: right; font-variant-numeric: tabular-nums; }
  input[type=range] { flex: 1; accent-color: var(--accent); }
  button {
    background: #243349; color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 7px 10px; cursor: pointer; font-size: 13px;
  }
  button:hover { background: #2e415e; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.active { background: var(--accent); color: #06121f; border-color: var(--accent); }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; }
  #gauges { width: 300px; font-size: 13px; }
  .gauge { margin: 6px 0; }
  .gauge .name { display: flex; justify-content: space-between; }
  .gauge .name .lim { color: var(--dim); font-size: 11px; }
  .bar { height: 8px; background: #0c1118; border-radius: 4px; margin-top: 3px; overflow: hidden; }
  .bar > div { height: 100%; width: 0%; background: var(--ok); transition: none; }
  .bar > div.hot { background: var(--warn); }
  .bar > div.over { background: var(--bad); }
  #report { width: 300px; font-size: 13px; white-space: pre-wrap; line-height: 1.5; }
  #status { font-weight: bold; }
  .ok { color: var(--ok); } .bad { color: var(--bad); } .warn { color: var(--warn); }
  #trendPanel { width: 100%; }
</style>
</head>
<body>
<h1>双水箱 · 共享闸门与泵 — 周期水位调度模拟</h1>

<div class="panel">
  <canvas id="view" width="640" height="420"></canvas>
</div>

<div id="controls" class="panel">
  <div class="row">
    <label>闸门开度</label>
    <input id="valve" type="range" min="0" max="100" value="0">
    <output id="valveOut">0%</output>
  </div>
  <div class="row">
    <label>泵转速</label>
    <input id="pump" type="range" min="0" max="100" value="0">
    <output id="pumpOut">0%</output>
  </div>
  <div class="row">
    <label>泵送方向</label>
    <button id="dirBtn">A → B</button>
  </div>
  <div class="btns">
    <button id="runBtn">▶ 运行</button>
    <button id="stepBtn">⏭ 单步</button>
    <button id="resetBtn">↺ 重置</button>
    <button id="replayBtn">⟲ 回放</button>
  </div>
  <div id="status">待机 — 点击「运行」开始周期</div>
</div>

<div id="gauges" class="panel"></div>

<div id="report" class="panel">报告：尚未运行。</div>

<div id="trendPanel" class="panel">
  <canvas id="trend" width="980" height="220"></canvas>
</div>

<script src="sim.js"></script>
</body>
</html>
