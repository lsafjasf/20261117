<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>磁带修复工作台 · Web Audio</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>磁带修复工作台</h1>
    <div class="status">
      <span id="modeLabel">状态: 主输出</span>
      <span id="nodeLabel">活动节点: 0</span>
      <span id="timeLabel">内容位置: 0.00s / 10.00s</span>
    </div>
  </header>

  <main>
    <section class="panel">
      <h2>走带控制</h2>
      <div class="row">
        <button id="btnPlay">播放</button>
        <button id="btnPause">暂停</button>
        <button id="btnReplay">重播</button>
        <button id="btnStep">单步</button>
        <button id="btnRestart">回到起点</button>
      </div>
      <h2>试听状态</h2>
      <div class="row">
        <button id="btnMain" class="mode-btn">主输出</button>
        <button id="btnBypass" class="mode-btn">旁路</button>
        <button id="btnMute" class="mode-btn">静音</button>
      </div>
      <div class="meters">
        <div><span>L</span><div class="bar"><i id="barL"></i></div><b id="dbL">-∞ dB</b></div>
        <div><span>R</span><div class="bar"><i id="barR"></i></div><b id="dbR">-∞ dB</b></div>
      </div>
    </section>

    <section class="panel">
      <h2>修复参数</h2>
      <div id="controls"></div>
      <div class="row">
        <button id="btnSave">保存参数</button>
        <button id="btnLoad">重载参数并播放</button>
        <button id="btnReset">恢复默认</button>
      </div>
      <p id="saveInfo" class="hint"></p>
    </section>

    <section class="panel wide">
      <h2>波形（实时）</h2>
      <canvas id="waveCanvas" height="180"></canvas>
      <h2>修复前 / 修复后频谱与峰值</h2>
      <canvas id="spectrumCanvas" height="200"></canvas>
      <h2>节点链</h2>
      <canvas id="chainCanvas" height="150"></canvas>
    </section>

    <section class="panel wide">
      <h2>导出 WAV（10 秒样例）</h2>
      <div class="row">
        <button id="btnExport">导出当前参数 WAV</button>
        <button id="btnExportReload">重载参数后再次导出</button>
        <a id="downloadLink" class="hidden" download="tape-repair.wav"></a>
      </div>
      <p id="exportInfo" class="hint"></p>
      <div id="exportCompare" class="result"></div>
    </section>

    <section class="panel wide">
      <h2>自动验证（频段 / 节拍 / 声道 / 漂移 / 削波 / 节点）</h2>
      <div class="row">
        <button id="btnVerify">运行验证套件</button>
      </div>
      <div id="verifyResults" class="result"></div>
    </section>
  </main>

  <script src="js/params.js"></script>
  <script src="js/wav-encoder.js"></script>
  <script src="js/metrics.js"></script>
  <script src="js/audio-engine.js"></script>
  <script src="js/draw.js"></script>
  <script src="js/verification.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
